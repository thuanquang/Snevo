<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Addresses - Snevo</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link href="../assets/css/animations.css" rel="stylesheet" />
    <link href="../assets/css/components.css" rel="stylesheet" />
    <link href="../assets/css/responsive.css" rel="stylesheet" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico" />
  </head>
  <body>
    <!-- Unified Navbar Root -->
    <div id="navbarRoot" data-navbar-page="addresses"></div>

    <!-- Main Content -->
    <main style="margin-top: 76px">
      <div class="container py-5">
        <div class="row">
          <div class="col-12">
            <h1 class="mb-4">My Addresses</h1>
            <p class="text-muted">Manage your delivery addresses</p>
            <div id="addressesContainer" class="mt-4">
              <!-- Addresses will be loaded dynamically -->
              <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading your addresses...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->
    <script src="../assets/js/config.js"></script>

    <!-- Custom Scripts -->
    <script type="module" src="../assets/js/ApiClient.js"></script>
    <script type="module" src="../assets/js/AuthManager.js"></script>
    <script type="module" src="../assets/js/NavbarManager.js"></script>
    <script type="module" src="../assets/js/Application.js"></script>
    <script src="../assets/js/animations.js"></script>

    <script>
      // Wait for auth to be ready before loading addresses
      (async function () {
        while (!window.authService) {
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
        await window.authService.initialize();

        if (!window.authService.isAuthenticated()) {
          if (window.showLoginModal) {
            window.showLoginModal();
          }
          return;
        }

        // Load addresses here
        console.log("Loading addresses for authenticated user");
      })();
    </script>
  </body>
</html>
