<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Snevo</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body>
    <!-- Unified Navbar Root with Cart Overrides -->
    <div id="navbarRoot" data-navbar-page="cart" data-navbar-hide-cart="true"></div>
    
    <!-- Cart Overrides Script -->
    <script>
        window.NAVBAR_OVERRIDES = {
            hideCart: true,
            showCheckoutButton: true,
            customActions: ['continue-shopping'],
            class: 'cart-navbar'
        };
    </script>

    <!-- Main Content -->
    <main style="margin-top: 76px;">
        <div class="container py-5">
            <div class="row">
                <div class="col-12">
                    <h1 class="mb-4">Shopping Cart</h1>
                    <p class="text-muted">Review your items before checkout</p>
                    <div id="cartContent">
                        <div id="cartItems" class="list-group mb-4"></div>
                        <div class="card">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="fw-bold">Subtotal: <span id="cartSubtotal">₫0</span></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <a href="products.html" class="btn btn-outline-secondary">Continue Shopping</a>
                                    <a href="checkout.html" class="btn btn-primary">Checkout</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Configuration -->
    <script src="../assets/js/config.js"></script>
    
    <!-- Custom Scripts -->
    <script type="module" src="../assets/js/ApiClient.js"></script>
    <script type="module" src="../assets/js/AuthManager.js"></script>
    <script type="module" src="../assets/js/NavbarManager.js"></script>
    <script type="module" src="../assets/js/Application.js"></script>
    <script type="module" src="../assets/js/CartManager.js"></script>
    <script src="../assets/js/animations.js"></script>
</body>
</html>
