<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail - Nike Store</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link href="../assets/css/animations.css" rel="stylesheet" />
    <link href="../assets/css/components.css" rel="stylesheet" />
    <link href="../assets/css/responsive.css" rel="stylesheet" />
    <link href="../assets/css/navbar.css" rel="stylesheet" />
    <link href="../assets/css/product-details.css" rel="stylesheet" />
    <link href="../assets/css/reviews.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbarRoot" data-navbar-page="products"></div>
    <!-- Loading State -->
    <div id="loading" class="loading">
      <div class="spinner-border text-dark" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Product Detail Container -->
    <div id="productDetail" class="container" style="display: none">
      <div class="row">
        <!-- Left Column: Image Gallery -->
        <div class="col-lg-7">
          <div class="product-gallery">
            <!-- Thumbnails (will be populated dynamically) -->
            <div id="thumbnailList" class="thumbnail-list mb-4"></div>

            <!-- Main Image -->
            <div id="mainImage" class="main-image">
              <img src="" alt="Product Image" />
            </div>
          </div>
        </div>

        <!-- Right Column: Product Info -->
        <div class="col-lg-5">
          <div class="product-info">
            <!-- Badge -->
            <div class="product-badge">
              <i class="fas fa-star"></i>
              <span>Highly Rated</span>
            </div>

            <!-- Title -->
            <h1 id="productTitle" class="product-title">Loading...</h1>
            <p id="productSubtitle" class="product-subtitle">Men's Shoes</p>

            <!-- Price -->
            <div class="product-price-section">
              <span id="currentPrice" class="price-current">₫0</span>
              <span
                id="originalPrice"
                class="price-original"
                style="display: none"
                >₫0</span
              >
              <span id="discount" class="price-discount" style="display: none"
                >0% off</span
              >
            </div>

            <!-- Color Selector -->
            <div class="color-selector">
              <h3 class="mb-3">Select Color</h3>
              <div id="colorOptions" class="color-options">
                <!-- Colors will be populated dynamically -->
              </div>
            </div>

            <!-- Size Selector -->
            <div class="size-selector">
              <div class="size-selector-header">
                <h3>Select Size</h3>
                <a href="#" class="size-guide-link">
                  <i class="fas fa-ruler"></i>
                  Size Guide
                </a>
              </div>
              <p class="size-info">
                Fits small; we recommend ordering half a size up
              </p>
              <div id="sizeOptions" class="size-options">
                <!-- Sizes will be populated dynamically -->
              </div>
            </div>
            <div id="stockWarning" style="display: none"></div>
            <!-- Stock Info -->
            <div id="stockInfo" class="stock-info" style="display: none">
              <i class="fas fa-info-circle"></i>
              <span id="stockMessage"></span>
            </div>

            <!-- Add to Bag Button -->
            <button id="addToBagBtn" class="add-to-bag-btn" disabled>
              <i class="fas fa-shopping-bag"></i>
              Add to Bag
            </button>

            <!-- Favorite Button -->
            <button class="favorite-btn">
              <i class="far fa-heart"></i>
              Favorite
            </button>

            <!-- Product Description -->
            <div class="product-description">
              <h3>Product Details</h3>
              <p id="productDescription">Loading product description...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Reviews Section -->
      <div class="row mt-5">
        <div class="col-12">
          <div class="reviews-section">
            <h2 class="section-title mb-4">Ratings & Reviews</h2>

            <!-- Review Summary -->
            <div id="reviewSummary" class="review-summary mb-4">
              <div class="row align-items-center">
                <div class="col-md-3 text-center">
                  <div class="average-rating">
                    <h1 id="avgRating" class="display-3 mb-0">0.0</h1>
                    <div id="avgStars" class="stars mb-2"></div>
                    <p id="totalReviews" class="text-muted">0 reviews</p>
                  </div>
                </div>
                <div class="col-md-6">
                  <div id="ratingDistribution" class="rating-distribution">
                    <!-- Rating bars will be populated here -->
                  </div>
                </div>
                <div class="col-md-3 text-center">
                  <button
                    id="writeReviewBtn"
                    class="btn btn-primary btn-lg"
                    style="display: none"
                  >
                    <i class="fas fa-pen"></i> Write a Review
                  </button>
                </div>
              </div>
            </div>

            <!-- Filter Options -->
            <div class="review-filters mb-3">
              <div class="d-flex align-items-center gap-2">
                <label class="fw-bold me-2">Filter by:</label>
                <button
                  class="btn btn-sm btn-outline-secondary filter-btn active"
                  data-rating="all"
                >
                  All
                </button>
                <button
                  class="btn btn-sm btn-outline-secondary filter-btn"
                  data-rating="5"
                >
                  5 ⭐
                </button>
                <button
                  class="btn btn-sm btn-outline-secondary filter-btn"
                  data-rating="4"
                >
                  4 ⭐
                </button>
                <button
                  class="btn btn-sm btn-outline-secondary filter-btn"
                  data-rating="3"
                >
                  3 ⭐
                </button>
                <button
                  class="btn btn-sm btn-outline-secondary filter-btn"
                  data-rating="2"
                >
                  2 ⭐
                </button>
                <button
                  class="btn btn-sm btn-outline-secondary filter-btn"
                  data-rating="1"
                >
                  1 ⭐
                </button>
              </div>
            </div>

            <!-- Reviews List -->
            <div id="reviewsList" class="reviews-list">
              <!-- Reviews will be populated here -->
            </div>

            <!-- Pagination -->
            <div
              id="reviewsPagination"
              class="d-flex justify-content-center mt-4"
            >
              <!-- Pagination controls will be populated here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Review Modal -->
    <div
      class="modal fade"
      id="reviewModal"
      tabindex="-1"
      aria-labelledby="reviewModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="reviewModalTitle">Write a Review</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="reviewForm">
              <input type="hidden" id="reviewId" value="" />
              <div class="mb-3">
                <label class="form-label fw-bold">Rating *</label>
                <div id="starRating" class="star-rating-input">
                  <div class="star" data-rating="1">
                    <svg viewBox="0 0 24 24" class="star-outline">
                      <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                      />
                    </svg>
                  </div>
                  <div class="star" data-rating="2">
                    <svg viewBox="0 0 24 24" class="star-outline">
                      <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                      />
                    </svg>
                  </div>
                  <div class="star" data-rating="3">
                    <svg viewBox="0 0 24 24" class="star-outline">
                      <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                      />
                    </svg>
                  </div>
                  <div class="star" data-rating="4">
                    <svg viewBox="0 0 24 24" class="star-outline">
                      <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                      />
                    </svg>
                  </div>
                  <div class="star" data-rating="5">
                    <svg viewBox="0 0 24 24" class="star-outline">
                      <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                      />
                    </svg>
                  </div>
                </div>
                <input type="hidden" id="ratingInput" value="0" required />
                <div class="invalid-feedback">Please select a rating</div>
              </div>
              <div class="mb-3">
                <label for="reviewComment" class="form-label fw-bold"
                  >Your Review</label
                >
                <textarea
                  id="reviewComment"
                  class="form-control"
                  rows="5"
                  maxlength="2000"
                  placeholder="Share your thoughts about this product..."
                ></textarea>
                <div class="form-text">
                  <span id="charCount">0</span>/2000 characters
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="submitReviewBtn">
              Submit Review
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>
    <!-- Unified Footer Root -->
    <div id="footerRoot"></div>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->
    <script src="../assets/js/config.js"></script>

    <!-- Custom Scripts -->
    <script type="module" src="../assets/js/ApiClient.js"></script>
    <script type="module" src="../assets/js/AuthManager.js"></script>
    <script type="module" src="../assets/js/NavbarManager.js"></script>
    <script type="module" src="../assets/js/FooterManager.js"></script>
    <script type="module" src="../assets/js/Application.js"></script>
    <script type="module" src="../assets/js/ReviewManager.js"></script>
    <script type="module" src="../assets/js/ProductDetailManager.js"></script>
    <script type="module" src="../assets/js/animations.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // ✅ Debug: Check Bootstrap availability
        console.log(
          "🔍 Bootstrap available:",
          typeof bootstrap !== "undefined"
        );
        console.log(
          "🔍 Bootstrap.Modal available:",
          typeof bootstrap !== "undefined" &&
            typeof bootstrap.Modal !== "undefined"
        );

        // ✅ Test modal close buttons
        setTimeout(() => {
          const modal = document.getElementById("reviewModal");
          const closeButtons = modal?.querySelectorAll(
            '[data-bs-dismiss="modal"]'
          );
          console.log("🔍 Modal found:", !!modal);
          console.log("🔍 Close buttons found:", closeButtons?.length);

          if (closeButtons) {
            closeButtons.forEach((btn, idx) => {
              console.log(`  Button ${idx}:`, btn.className);
            });
          }
        }, 500);

        setTimeout(() => {
          const productId = new URLSearchParams(window.location.search).get(
            "id"
          );
          if (!productId) {
            showAlert("Product not found", "danger");
            setTimeout(() => {
              window.location.href = "products.html";
            }, 2000);
            return;
          }

          // ⭐ FIX: Assign to window object
          if (!window.productDetailManager) {
            window.productDetailManager = new ProductDetailManager();
          }
          window.productDetailManager.init(productId);
        }, 100);
      });

      // Show Alert Helper
      function showAlert(message, type = "info") {
        const alertContainer = document.getElementById("alertContainer");
        if (!alertContainer) return;

        const alert = document.createElement("div");
        alert.className = `alert alert-${type} alert-dismissible fade show alert-custom`;
        alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
        alertContainer.appendChild(alert);

        setTimeout(() => {
          alert.remove();
        }, 3000);
      }
    </script>
  </body>
</html>
