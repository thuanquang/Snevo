<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Snevo</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link href="../assets/css/navbar.css" rel="stylesheet" />
    <link href="../assets/css/footer.css" rel="stylesheet" />
    <link href="../assets/css/products.css" rel="stylesheet" />
    <link href="../assets/css/components.css" rel="stylesheet" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico" />
  </head>
  <body>
    <!-- Unified Navbar Root -->
    <div id="navbarRoot" data-navbar-page="products"></div>

    <!-- Page Header -->
    <section class="page-header bg-light py-5" style="margin-top: 76px">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h1 class="page-title mb-2">Our Products</h1>
            <p class="page-subtitle text-muted mb-0">
              Discover premium athletic footwear designed for champions
            </p>
          </div>
          <div class="col-md-6 text-md-end"></div>
        </div>
      </div>
    </section>
    <!-- Products Section -->
    <section class="products-section py-5">
      <div class="container">
        <div class="row">
          <!-- Sidebar Filters -->
          <div class="col-lg-3 col-md-4">
            <div class="filters-sidebar">
              <div class="filters-header d-flex justify-content-between">
                <h5 class="mb-0">Filters</h5>
                <button
                  class="btn btn-sm btn-outline-secondary"
                  id="clearFilters"
                >
                  Clear All
                </button>
              </div>
              <div class="filters-body">
                <!-- Category Filter -->
                <div class="filter-group mb-4">
                  <h6 class="filter-title">Categories</h6>
                  <div class="filter-options" id="categoryFilters">
                  </div>
                </div>

                <!-- Price Filter -->
                <div class="filter-group mb-4">
                  <h6 class="filter-title">Price Range</h6>
                  <div class="price-range">
                    <div class="row">
                      <div class="col-6">
                        <input
                          type="number"
                          class="form-control form-control-sm"
                          placeholder="Min"
                          id="minPrice"
                        />
                      </div>
                      <div class="col-6">
                        <input
                          type="number"
                          class="form-control form-control-sm"
                          placeholder="Max"
                          id="maxPrice"
                        />
                      </div>
                    </div>
                    <div class="mt-2">
                      <input
                        type="range"
                        class="form-range"
                        min="0"
                        max="500"
                        value="250"
                        id="priceRange"
                      />
                      <div
                        class="d-flex justify-content-between small text-muted"
                      >
                        <span>$0</span>
                        <span>$500+</span>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Size Filter -->
                <div class="filter-group mb-4">
                  <h6 class="filter-title">Size</h6>
                  <div class="size-options" id="sizeFilters"></div>
                </div>

                <!-- Color Filter -->
                <div class="filter-group mb-4">
                  <h6 class="filter-title">Colors</h6>
                  <div class="color-options" id="colorFilters"></div>
                </div>

                <!-- Brand Filter -->
                <div class="filter-group mb-4">
                  <h6 class="filter-title">Brand</h6>
                  <div class="filter-options" id="brandFilters">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        value="nike"
                        id="brandNike"
                      />
                      <label class="form-check-label" for="brandNike"
                        >Nike</label
                      >
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        value="adidas"
                        id="brandAdidas"
                      />
                      <label class="form-check-label" for="brandAdidas"
                        >Adidas</label
                      >
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        value="jordan"
                        id="brandJordan"
                      />
                      <label class="form-check-label" for="brandJordan"
                        >Jordan</label
                      >
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Products Grid -->
          <div class="col-lg-9 col-md-8">
            <!-- ⭐ SEARCH BAR -->
            <div class="container">
              <div class="search-bar-container mb-4">
                <div class="input-group input-group-lg">
                  <input
                    type="text"
                    class="form-control border-start-0"
                    id="searchInput"
                    placeholder="Search products by name..."
                    autocomplete="off"
                  />
                  <button
                    class="btn btn-primary"
                    type="button"
                    id="searchButton"
                  >
                    Search
                  </button>
                </div>
                <small
                  class="text-muted d-block mt-2"
                  id="searchResultText"
                ></small>
              </div>
            </div>
            <!-- Toolbar -->
            <div class="products-toolbar mb-4">
              <div class="row align-items-center">
                <div class="col-md-6">
                  <div class="results-info">
                    <span id="resultsCount">Showing 1-12 of 48 products</span>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="d-flex align-items-center justify-content-md-end">
                    <!-- Sort Dropdown -->
                    <div class="me-3">
                      <select
                        class="form-select form-select-sm"
                        id="sortSelect"
                      >
                        <option value="featured">Sort by: Featured</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                        <option value="name_asc">Name: A to Z</option>
                        <option value="name_desc">Name: Z to A</option>
                        <option value="newest">Newest First</option>
                      </select>
                    </div>

                    <!-- View Toggle -->
                    <div class="btn-group" role="group">
                      <button
                        type="button"
                        class="btn btn-outline-secondary btn-sm active"
                        id="gridView"
                        title="Grid View"
                      >
                        <i class="fas fa-th"></i>
                      </button>
                      <button
                        type="button"
                        class="btn btn-outline-secondary btn-sm"
                        id="listView"
                        title="List View"
                      >
                        <i class="fas fa-list"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Loading State -->
            <div
              class="loading-container text-center py-5"
              id="loadingContainer"
            >
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-3 text-muted">Loading products...</p>
            </div>

            <!-- Products Grid Container -->
            <div
              class="products-grid row"
              id="productsGrid"
              style="display: none"
            >
              <!-- Products will be loaded dynamically -->
            </div>

            <!-- No Results -->
            <div
              class="no-results text-center py-5"
              id="noResults"
              style="display: none"
            >
              <i class="fas fa-search fa-3x text-muted mb-3"></i>
              <h4>No products found</h4>
              <p class="text-muted">
                Try adjusting your filters or search terms
              </p>
              <button class="btn btn-primary" onclick="clearAllFilters()">
                Clear Filters
              </button>
            </div>

            <!-- Pagination -->
            <nav aria-label="Products pagination" class="mt-5">
              <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be generated dynamically -->
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </section>
    <!-- Unified Footer Root -->
    <div id="footerRoot"></div>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->
    <script src="../assets/js/config.js"></script>

    <!-- Custom Scripts -->
    <script type="module" src="../assets/js/ApiClient.js"></script>
    <script type="module" src="../assets/js/AuthManager.js"></script>
    <script type="module" src="../assets/js/NavbarManager.js"></script>
    <script type="module" src="../assets/js/FooterManager.js"></script>
    <script type="module" src="../assets/js/ProductManager.js"></script>
    <script
      type="module"
      src="../assets/js/EmailVerificationNotice.js"
    ></script>
    <script type="module" src="../assets/js/Application.js"></script>
    <script type="module" src="../assets/js/auth-persistence.js"></script>
    <script type="module" src="../assets/js/animations.js"></script>       
    <style>
             
    </style>
</body>
</html>
