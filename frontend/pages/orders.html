<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Snevo</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../assets/css/main.css" rel="stylesheet">
    <link href="../assets/css/animations.css" rel="stylesheet">
    <link href="../assets/css/components.css" rel="stylesheet">
    <link href="../assets/css/responsive.css" rel="stylesheet">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body>
    <!-- Unified Navbar Root -->
    <div id="navbarRoot" data-navbar-page="orders"></div>

    <!-- Main Content -->
    <main style="margin-top: 76px;">
        <div class="container py-5">
            <div class="row">
                <div class="col-12">
                    <h1 class="mb-4">My Orders</h1>
                    <p class="text-muted">Track and manage your orders</p>
                    <div id="ordersContainer" class="mt-4">
                        <!-- Orders will be loaded dynamically -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3 text-muted">Loading your orders...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Configuration -->
    <script src="../assets/js/config.js"></script>
    
    <!-- Custom Scripts -->
    <script type="module" src="../assets/js/ApiClient.js"></script>
    <script type="module" src="../assets/js/AuthManager.js"></script>
    <script type="module" src="../assets/js/NavbarManager.js"></script>
    <script type="module" src="../assets/js/Application.js"></script>
    <script src="../assets/js/animations.js"></script>
    
    <script>
        // Wait for auth and API to be ready, then load orders
        (async function() {
            const container = document.getElementById('ordersContainer');
            
            // Wait for auth and APIs
            let attempts = 0;
            while (!(window.authService?.initialized && window.ordersAPI) && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            // Check authentication
            if (!window.authService?.isAuthenticated()) {
                if (window.showLoginModal) {
                    window.showLoginModal();
                }
                return;
            }

            try {
                console.log('📦 Loading orders...');
                const response = await window.ordersAPI.getOrders();
                
                // API returns { success, data: [orders], message }
                const orders = response?.data || response || [];
                console.log('✅ Orders loaded:', orders);
                
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p class="text-muted text-center py-5">You have no orders yet.</p>';
                    return;
                }

                // Render orders
                const html = orders.map(order => {
                    const totalAmount = order.total_amount || 0;
                    const status = order.status || 'pending';
                    const orderDate = new Date(order.created_at || order.order_date);
                    const formattedDate = orderDate.toLocaleString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    return `
                        <div class="card mb-3 shadow-sm">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <div class="fw-bold fs-5">Order #${order.order_id}</div>
                                        <div class="text-muted small mt-2">
                                            <i class="fas fa-calendar"></i> ${formattedDate}
                                        </div>
                                        <div class="mt-2">
                                            <span class="badge bg-${status === 'pending' ? 'warning' : status === 'processing' ? 'info' : status === 'delivered' ? 'success' : 'secondary'}">
                                                ${status.charAt(0).toUpperCase() + status.slice(1)}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <div class="fw-bold fs-5">
                                            ₫${new Intl.NumberFormat('vi-VN').format(Math.round(totalAmount))}
                                        </div>
                                        <button class="btn btn-sm btn-outline-primary mt-3" onclick="window.location.href='orders.html?order_id=${order.order_id}'">
                                            View Details
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;
            } catch (err) {
                console.error('❌ Failed to load orders:', err);
                container.innerHTML = `<p class="text-danger text-center py-5">Failed to load orders. ${err.message}</p>`;
            }
        })();
    </script>
</body>
</html>
